<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VerdantChain · QR Batch Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="abi.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      background: linear-gradient(145deg, #f4f9ee 0%, #e2eed9 100%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(100, 150, 80, 0.3);
      border-radius: 1.5rem;
    }

    .btn-fruit {
      transition: all 0.15s;
      background: linear-gradient(135deg, #1e5f2e, #2d6a4f);
    }

    .btn-fruit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px -10px #1e5f2e;
    }

    .table-container {
      overflow-x: auto;
      max-width: 100%;
      border-radius: 1rem;
    }

    .batch-table {
      min-width: 1000px;
      border-collapse: separate;
      border-spacing: 0 6px;
    }

    .batch-table th {
      @apply bg-green-50 text-green-800 text-xs font-semibold px-3 py-2.5 whitespace-nowrap;
    }

    .batch-table td {
      @apply bg-white/90 px-3 py-2.5 text-sm text-gray-700 whitespace-nowrap;
    }

    .batch-table tr:hover td {
      @apply bg-green-50/60;
    }

    .batch-table th:first-child {
      border-radius: 0.5rem 0 0 0.5rem;
    }

    .batch-table th:last-child {
      border-radius: 0 0.5rem 0.5rem 0;
    }

    /* Hide elements when in QR scan mode */
    .qr-only {
      display: block;
    }

    .scan-mode .qr-only {
      display: none;
    }
  </style>
</head>

<body class="antialiased p-4 min-h-screen flex items-start justify-center" id="mainBody">

  <div class="max-w-5xl w-full my-6">
    <!-- header with back link - visible in both modes -->
    <div class="flex items-center justify-between mb-4">
      <a href="https://shayandanish.github.io/Remix-food-traceability/frontend/index.html"
        class="text-green-700 hover:text-green-800 flex items-center gap-1 text-sm bg-white/60 backdrop-blur-sm px-4 py-2 rounded-full border border-green-200 transition">
        <i class="fas fa-arrow-left"></i> back to landing
      </a>
      <div class="text-green-800 font-semibold flex items-center gap-2 bg-white/40 px-4 py-2 rounded-full">
        <i class="fas fa-seedling"></i>
        <span>QR batch viewer</span>
      </div>
    </div>

    <!-- main qr card -->
    <div class="glass-panel p-5 md:p-6 shadow-xl">

      <!-- ===== QR GENERATOR SECTION - HIDDEN WHEN SCANNED ===== -->
      <div id="qrGeneratorSection" class="qr-only">
        <div class="flex items-center gap-3 border-b border-green-200 pb-3 mb-4">
          <i class="fas fa-qrcode text-2xl text-indigo-600"></i>
          <h2 class="text-xl md:text-2xl font-bold text-green-800">farmer QR scanner</h2>
        </div>

        <!-- input row -->
        <div class="flex flex-col sm:flex-row gap-3">
          <input id="farmerInput" type="text" placeholder="e.g. John Farmer"
            class="flex-1 p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-300 outline-none bg-white/80">
          <button onclick="generateQRCode()"
            class="btn-fruit text-white px-6 py-3 rounded-xl font-medium flex items-center justify-center gap-2 shadow-md whitespace-nowrap">
            <i class="fas fa-qrcode"></i> generate QR
          </button>
        </div>

        <!-- QR display area + link row -->
        <div class="flex flex-col md:flex-row items-center gap-6 mt-6">
          <div id="qrcode"
            class="flex justify-center items-center bg-white p-3 rounded-2xl shadow-md min-w-[160px] min-h-[160px]">
            <div class="text-gray-400 text-xs text-center">✨ QR code<br>will appear here</div>
          </div>
          <div class="flex-1 text-sm break-all bg-white/50 p-3 rounded-xl border border-green-100">
            <i class="fas fa-link text-green-600 mr-1"></i>
            <span id="generatedLink" class="text-indigo-700"></span>
          </div>
        </div>
      </div>

      <!-- ===== BATCH DETAILS SECTION - ALWAYS VISIBLE ===== -->
      <div class="mt-4" id="batchSection">
        <div class="flex items-center gap-2 mb-3">
          <i class="fas fa-clipboard-list text-green-600 text-xl"></i>
          <h3 class="font-semibold text-gray-800 text-lg">batch details</h3>
          <span id="batchCount" class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full ml-2"></span>
        </div>

        <div class="table-container border border-green-100 rounded-2xl bg-white/70 shadow-inner">
          <div class="p-1">
            <div id="result" class="overflow-x-auto">
              <!-- Default message changes based on mode -->
              <div id="defaultMessage" class="text-gray-400 text-center py-8">
                <i class="fas fa-qrcode text-4xl mb-3 text-green-300"></i>
                <p>Enter a farmer name above to generate QR code</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- hint - changes based on mode -->
      <p class="text-xs text-gray-400 mt-4 flex items-center gap-1">
        <i class="fas fa-info-circle"></i>
        <span id="scanHint">Generate a QR code or scan one to view batch details</span>
      </p>
    </div>
  </div>

  <script>
    // --- web3 / contract globals ---
    let web3, contract;
    let isScanMode = false; // Track if we're in QR scan mode

    // --- auto-connect to MetaMask on page load ---
    async function initWeb3() {
      if (typeof window.ethereum !== "undefined") {
        try {
          web3 = new Web3(window.ethereum);

          // Check if already authorized without prompting
          const accounts = await window.ethereum.request({ method: 'eth_accounts' });

          if (accounts.length > 0) {
            console.log("MetaMask already connected:", accounts[0]);
          }

          // Initialize contract if ABI and address exist
          if (typeof contractAddress !== 'undefined' && typeof abi !== 'undefined') {
            contract = new web3.eth.Contract(abi, contractAddress);
            console.log("Contract initialized");
          } else {
            console.error("ABI or contractAddress not defined in abi.js");
          }

        } catch (err) {
          console.error("Web3 initialization error:", err);
        }
      } else {
        console.log("MetaMask not detected");
      }
    }

    // --- format date nicely (DD/MM/YYYY) ---
    function formatDisplayDate(timestamp) {
      if (!timestamp || timestamp === '0' || timestamp === 0) return '—';
      const ts = typeof timestamp === 'bigint' ? Number(timestamp) : Number(timestamp);
      if (isNaN(ts) || ts === 0) return '—';
      const d = new Date(ts * 1000);
      if (isNaN(d.getTime())) return '—';
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}/${month}/${year}`;
    }

    // --- safe string getter ---
    function safeStr(val) {
      if (!val) return '—';
      if (typeof val === 'object') {
        return '—';
      }
      return String(val).trim() || '—';
    }

    // --- ensure MetaMask is connected before fetching ---
    async function ensureMetaMaskConnected() {
      if (!window.ethereum) {
        return false;
      }

      if (!web3) {
        web3 = new Web3(window.ethereum);
      }

      try {
        // Try to get accounts without prompting if possible
        const accounts = await window.ethereum.request({ method: 'eth_accounts' });

        if (accounts.length === 0) {
          // Try to request connection (this will show popup)
          const newAccounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
          if (newAccounts.length === 0) return false;
        }

        // Re-initialize contract if needed
        if (!contract && typeof contractAddress !== 'undefined' && typeof abi !== 'undefined') {
          contract = new web3.eth.Contract(abi, contractAddress);
        }

        return true;
      } catch (err) {
        console.error("MetaMask connection error:", err);
        return false;
      }
    }

    // --- generate QR code (normal mode) ---
    function generateQRCode() {
      const farmer = document.getElementById("farmerInput").value.trim();
      if (!farmer) {
        alert("🌱 Please enter a farmer name.");
        return;
      }

      const baseUrl = 'https://shayandanish.github.io/Remix-food-traceability/frontend/qrcode.html';
      const url = `${baseUrl}?farmer=${encodeURIComponent(farmer)}`;

      // clear and generate qr
      const qrDiv = document.getElementById("qrcode");
      qrDiv.innerHTML = '';

      new QRCode(qrDiv, {
        text: url,
        width: 150,
        height: 150,
        colorDark: "#1e4a2b",
        colorLight: "#ffffff",
      });

      document.getElementById("generatedLink").innerHTML = `<a href="${url}" target="_blank" class="underline break-all">${url}</a>`;

      document.getElementById("scanHint").innerHTML = '<i class="fas fa-camera mr-1"></i> Scan this QR code with your phone to view batch details';

      // Also fetch and display batch details immediately
      fetchBatchDetails(farmer);
    }

    // --- fetch batch and render table ---
    async function fetchBatchDetails(farmerName) {
      const resultDiv = document.getElementById("result");
      const batchCountSpan = document.getElementById("batchCount");
      const defaultMsg = document.getElementById("defaultMessage");

      if (defaultMsg) defaultMsg.style.display = 'none';

      resultDiv.innerHTML = '<div class="text-center text-gray-500 py-8"><i class="fas fa-spinner fa-spin mr-2"></i> loading batch data...</div>';
      batchCountSpan.textContent = '';

      if (!farmerName) {
        resultDiv.innerHTML = '<div class="text-center text-red-500 py-8">❌ No farmer name provided.</div>';
        return;
      }

      // First ensure MetaMask is connected
      const connected = await ensureMetaMaskConnected();
      if (!connected) {
        resultDiv.innerHTML = '<div class="text-center text-red-500 py-8">❌ Please connect MetaMask to view batch data.</div>';
        return;
      }

      try {
        if (!contract) {
          if (typeof contractAddress === 'undefined' || typeof abi === 'undefined') {
            resultDiv.innerHTML = '<div class="text-center text-red-500 py-8">❌ Contract configuration missing.</div>';
            return;
          }
          contract = new web3.eth.Contract(abi, contractAddress);
        }

        // Call the contract
        const batchIds = await contract.methods.getBatchesByFarmer(farmerName).call();

        if (!batchIds || batchIds.length === 0) {
          resultDiv.innerHTML = '<div class="text-center text-gray-500 py-8">🚫 No batches found for this farmer.</div>';
          batchCountSpan.textContent = '0';
          return;
        }

        batchCountSpan.textContent = `${batchIds.length} batch${batchIds.length > 1 ? 'es' : ''}`;

        // Build table
        let html = `<table class="batch-table w-full text-left">
          <thead>
            <tr>
              <th class="rounded-l-lg">PRODUCT</th>
              <th>HARVEST</th>
              <th>TRANSPORT</th>
              <th>WAREHOUSE</th>
              <th>FARMER</th>
              <th>RETAILER</th>
              <th>STORE</th>
              <th class="rounded-r-lg">QUALITY</th>
            </tr>
          </thead>
          <tbody>`;

        for (const batchId of batchIds) {
          const batch = await contract.methods.batches(batchId).call();

          // Extract nested objects properly
          const farmerData = batch.farmer || {};
          const transportData = batch.transport || {};
          const warehouseData = batch.warehouse || {};
          const retailerData = batch.retailer || {};

          // Farmer name
          let farmerNameDisplay = '—';
          if (batch.farmerName && typeof batch.farmerName !== 'object') farmerNameDisplay = safeStr(batch.farmerName);
          else if (farmerData.farmerName) farmerNameDisplay = safeStr(farmerData.farmerName);

          // Retailer name
          let retailerNameDisplay = '—';
          if (batch.retailerName && typeof batch.retailerName !== 'object') retailerNameDisplay = safeStr(batch.retailerName);
          else if (retailerData.retailerName) retailerNameDisplay = safeStr(retailerData.retailerName);

          // Store name
          let storeDisplay = '—';
          if (batch.retailStore && typeof batch.retailStore !== 'object') storeDisplay = safeStr(batch.retailStore);
          else if (retailerData.retailStore) storeDisplay = safeStr(retailerData.retailStore);

          // Product name
          let productDisplay = '—';
          if (farmerData.productName) productDisplay = safeStr(farmerData.productName);
          else if (batch.productName) productDisplay = safeStr(batch.productName);

          // Harvest date
          let harvestDisplay = '—';
          if (farmerData.harvestDate) harvestDisplay = formatDisplayDate(farmerData.harvestDate);
          else if (batch.harvestDate) harvestDisplay = formatDisplayDate(batch.harvestDate);

          // Transport
          let transportDisplay = '—';
          if (transportData.transporterName) transportDisplay = safeStr(transportData.transporterName);
          else if (batch.transporterName) transportDisplay = safeStr(batch.transporterName);

          // Warehouse
          let warehouseDisplay = '—';
          if (warehouseData.warehouseName) warehouseDisplay = safeStr(warehouseData.warehouseName);
          else if (batch.warehouseName) warehouseDisplay = safeStr(batch.warehouseName);

          // Quality
          let qualityDisplay = safeStr(batch.quality) || '—';

          html += `<tr>
            <td class="font-medium">${productDisplay}</td>
            <td>${harvestDisplay}</td>
            <td>${transportDisplay}</td>
            <td>${warehouseDisplay}</td>
            <td>${farmerNameDisplay}</td>
            <td>${retailerNameDisplay}</td>
            <td>${storeDisplay}</td>
            <td>${qualityDisplay}</td>
          </tr>`;
        }

        html += `</tbody></table>`;
        resultDiv.innerHTML = html;

        // Update hint based on mode
        if (isScanMode) {
          document.getElementById("scanHint").innerHTML = `<i class="fas fa-check-circle text-green-600 mr-1"></i> Showing ${batchIds.length} batches for farmer: ${farmerName}`;
        } else {
          document.getElementById("scanHint").innerHTML = `<i class="fas fa-check-circle text-green-600 mr-1"></i> Loaded ${batchIds.length} batches for ${farmerName}`;
        }

      } catch (err) {
        console.error("Fetch error:", err);
        resultDiv.innerHTML = `<div class="text-center text-red-500 py-6">❌ Error: ${err.message}</div>`;
      }
    }

    // --- MAIN: Check if this is a QR code scan ---
    window.addEventListener("load", async () => {
      // Initialize web3 first
      await initWeb3();

      const params = new URLSearchParams(window.location.search);
      const farmerName = params.get("farmer");

      if (farmerName) {
        // QR CODE SCAN DETECTED - Hide generator, show only batch details
        console.log("QR CODE SCANNED MODE - hiding generator");
        isScanMode = true;

        // HIDE the QR generator section
        const generatorSection = document.getElementById("qrGeneratorSection");
        if (generatorSection) {
          generatorSection.style.display = 'none';
        }

        // Update header to be more minimal for scan mode
        document.querySelector(".text-green-800.font-semibold").innerHTML = '<i class="fas fa-seedling"></i> batch view';

        // Update the default message
        const defaultMsg = document.getElementById("defaultMessage");
        if (defaultMsg) {
          defaultMsg.innerHTML = '<i class="fas fa-spinner fa-spin text-4xl mb-3 text-green-300"></i><p>Loading batch details for farmer: ' + farmerName + '</p>';
        }

        document.getElementById("scanHint").innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> QR detected! Loading data...';

        // Fetch and display batch details
        setTimeout(() => {
          fetchBatchDetails(farmerName);
        }, 500);
      } else {
        // Normal mode - show everything
        console.log("NORMAL MODE - showing generator");
        document.getElementById("scanHint").innerHTML = '👆 Enter a farmer name above to generate a QR code';
      }
    });

    // Listen for account changes
    if (window.ethereum) {
      window.ethereum.on('accountsChanged', function (accounts) {
        console.log('Account changed:', accounts);
        if (accounts.length > 0) {
          // Check if there's a farmer in URL and reload data
          const params = new URLSearchParams(window.location.search);
          const farmerName = params.get("farmer");
          if (farmerName) {
            fetchBatchDetails(farmerName);
          }
        }
      });
    }
  </script>
</body>

</html>
