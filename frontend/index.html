<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fruit Traceability DApp</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-800 font-sans">
    <div class="max-w-3xl mx-auto p-6">
      <h2 class="text-3xl font-bold mb-4 text-center">
        🍎 Fruit Traceability DApp
      </h2>
      <div class="text-center mb-8">
        <button
          onclick="connectWallet()"
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
        >
          Connect MetaMask
        </button>
      </div>

      <div class="space-y-6">
        <div class="bg-white p-6 rounded shadow">
          <h3 class="text-xl font-semibold mb-4">Add Batch</h3>
          <div class="space-y-2">
            <input
              id="productName"
              placeholder="Product Name"
              class="w-full p-2 border rounded"
            />
            <input
              id="originFarm"
              placeholder="Origin Farm"
              class="w-full p-2 border rounded"
            />
            <input
              id="farmerName"
              placeholder="Farmer Name"
              class="w-full p-2 border rounded"
            />
            <input
              id="harvestDate"
              type="date"
              class="w-full p-2 border rounded"
            />
            <button
              onclick="addBatch()"
              class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
            >
              Add Batch
            </button>
          </div>
        </div>

        <div class="bg-white p-6 rounded shadow">
          <h3 class="text-xl font-semibold mb-4">Update Transport</h3>
          <div class="space-y-2">
            <input
              id="batchIdTransport"
              placeholder="Batch ID"
              class="w-full p-2 border rounded"
            />
            <input
              id="transporterName"
              placeholder="Transporter Name"
              class="w-full p-2 border rounded"
            />
            <input
              id="transportDetails"
              placeholder="Transport Details"
              class="w-full p-2 border rounded"
            />
            <input
              id="transportDate"
              type="date"
              class="w-full p-2 border rounded"
            />
            <button
              onclick="updateTransportInfo()"
              class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600"
            >
              Update Transport
            </button>
          </div>
        </div>

        <div class="bg-white p-6 rounded shadow">
          <h3 class="text-xl font-semibold mb-4">Update Warehouse</h3>
          <div class="space-y-2">
            <input
              id="batchIdWarehouse"
              placeholder="Batch ID"
              class="w-full p-2 border rounded"
            />
            <input
              id="warehouseName"
              placeholder="Warehouse Name"
              class="w-full p-2 border rounded"
            />
            <input
              id="warehouseDetails"
              placeholder="Warehouse Details"
              class="w-full p-2 border rounded"
            />
            <input
              id="warehouseDate"
              type="date"
              class="w-full p-2 border rounded"
            />
            <button
              onclick="updateWarehouseInfo()"
              class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700"
            >
              Update Warehouse
            </button>
          </div>
        </div>

        <div class="bg-white p-6 rounded shadow">
          <h3 class="text-xl font-semibold mb-4">Update Retail</h3>
          <div class="space-y-2">
            <input
              id="batchIdRetail"
              placeholder="Batch ID"
              class="w-full p-2 border rounded"
            />
            <input
              id="retailerName"
              placeholder="Retailer Name"
              class="w-full p-2 border rounded"
            />
            <input
              id="retailStore"
              placeholder="Retail Store"
              class="w-full p-2 border rounded"
            />
            <input
              id="retailDate"
              type="date"
              class="w-full p-2 border rounded"
            />
            <button
              onclick="updateRetailerInfo()"
              class="bg-pink-600 text-white px-4 py-2 rounded hover:bg-pink-700"
            >
              Update Retail
            </button>
          </div>
        </div>

        <div class="bg-white p-6 rounded shadow">
          <h3 class="text-xl font-semibold mb-4">Get Batch by Farmer Name</h3>
          <div class="space-y-2">
            <input
              id="farmerNameInput"
              placeholder="Farmer Name"
              class="w-full p-2 border rounded"
            />
            <button
              onclick="getBatch()"
              class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700"
            >
              Get Batch
            </button>
            <pre
              id="batchResult"
              class="bg-gray-100 p-3 rounded text-sm overflow-auto max-h-64"
            ></pre>
          </div>
        </div>
      </div>
    </div>
    <script>
      let web3;
      let contract;
      const contractAddress = "0x975f251b8f33ab4c536a8de9f0b04aa552074db4";
      const abi = [
        {
          inputs: [
            {
              internalType: "string",
              name: "productName",
              type: "string",
            },
            {
              internalType: "string",
              name: "originFarm",
              type: "string",
            },
            {
              internalType: "string",
              name: "farmerName",
              type: "string",
            },
            {
              internalType: "uint256",
              name: "harvestDate",
              type: "uint256",
            },
          ],
          name: "addBatch",
          outputs: [],
          stateMutability: "nonpayable",
          type: "function",
        },
        {
          anonymous: false,
          inputs: [
            {
              indexed: false,
              internalType: "string",
              name: "batchId",
              type: "string",
            },
          ],
          name: "BatchAdded",
          type: "event",
        },
        {
          anonymous: false,
          inputs: [
            {
              indexed: false,
              internalType: "string",
              name: "batchId",
              type: "string",
            },
            {
              indexed: false,
              internalType: "string",
              name: "newOwner",
              type: "string",
            },
            {
              indexed: false,
              internalType: "string",
              name: "status",
              type: "string",
            },
          ],
          name: "BatchUpdated",
          type: "event",
        },
        {
          inputs: [
            {
              internalType: "string",
              name: "batchId",
              type: "string",
            },
            {
              internalType: "string",
              name: "retailerName",
              type: "string",
            },
            {
              internalType: "string",
              name: "retailStore",
              type: "string",
            },
            {
              internalType: "uint256",
              name: "retailDate",
              type: "uint256",
            },
          ],
          name: "updateRetailerInfo",
          outputs: [],
          stateMutability: "nonpayable",
          type: "function",
        },
        {
          inputs: [
            {
              internalType: "string",
              name: "batchId",
              type: "string",
            },
            {
              internalType: "string",
              name: "transporterName",
              type: "string",
            },
            {
              internalType: "string",
              name: "transportDetails",
              type: "string",
            },
            {
              internalType: "uint256",
              name: "transportDate",
              type: "uint256",
            },
          ],
          name: "updateTransportInfo",
          outputs: [],
          stateMutability: "nonpayable",
          type: "function",
        },
        {
          inputs: [
            {
              internalType: "string",
              name: "batchId",
              type: "string",
            },
            {
              internalType: "string",
              name: "warehouseName",
              type: "string",
            },
            {
              internalType: "string",
              name: "warehouseDetails",
              type: "string",
            },
            {
              internalType: "uint256",
              name: "warehouseDate",
              type: "uint256",
            },
          ],
          name: "updateWarehouseInfo",
          outputs: [],
          stateMutability: "nonpayable",
          type: "function",
        },
        {
          inputs: [],
          name: "batchCounter",
          outputs: [
            {
              internalType: "uint256",
              name: "",
              type: "uint256",
            },
          ],
          stateMutability: "view",
          type: "function",
        },
        {
          inputs: [
            {
              internalType: "string",
              name: "",
              type: "string",
            },
          ],
          name: "batches",
          outputs: [
            {
              internalType: "string",
              name: "batchId",
              type: "string",
            },
            {
              components: [
                {
                  internalType: "string",
                  name: "productName",
                  type: "string",
                },
                {
                  internalType: "string",
                  name: "originFarm",
                  type: "string",
                },
                {
                  internalType: "string",
                  name: "farmerName",
                  type: "string",
                },
                {
                  internalType: "uint256",
                  name: "harvestDate",
                  type: "uint256",
                },
              ],
              internalType: "struct FruitTraceability.FarmerInfo",
              name: "farmer",
              type: "tuple",
            },
            {
              components: [
                {
                  internalType: "string",
                  name: "transporterName",
                  type: "string",
                },
                {
                  internalType: "string",
                  name: "transportDetails",
                  type: "string",
                },
                {
                  internalType: "uint256",
                  name: "transportDate",
                  type: "uint256",
                },
              ],
              internalType: "struct FruitTraceability.TransportInfo",
              name: "transport",
              type: "tuple",
            },
            {
              components: [
                {
                  internalType: "string",
                  name: "warehouseName",
                  type: "string",
                },
                {
                  internalType: "string",
                  name: "warehouseDetails",
                  type: "string",
                },
                {
                  internalType: "uint256",
                  name: "warehouseDate",
                  type: "uint256",
                },
              ],
              internalType: "struct FruitTraceability.WarehouseInfo",
              name: "warehouse",
              type: "tuple",
            },
            {
              components: [
                {
                  internalType: "string",
                  name: "retailerName",
                  type: "string",
                },
                {
                  internalType: "string",
                  name: "retailStore",
                  type: "string",
                },
                {
                  internalType: "uint256",
                  name: "retailDate",
                  type: "uint256",
                },
              ],
              internalType: "struct FruitTraceability.RetailInfo",
              name: "retailer",
              type: "tuple",
            },
            {
              internalType: "string",
              name: "currentOwner",
              type: "string",
            },
            {
              internalType: "string",
              name: "status",
              type: "string",
            },
            {
              internalType: "uint256",
              name: "lastUpdated",
              type: "uint256",
            },
          ],
          stateMutability: "view",
          type: "function",
        },
        {
          inputs: [
            {
              internalType: "string",
              name: "",
              type: "string",
            },
            {
              internalType: "uint256",
              name: "",
              type: "uint256",
            },
          ],
          name: "farmerToBatchIds",
          outputs: [
            {
              internalType: "string",
              name: "",
              type: "string",
            },
          ],
          stateMutability: "view",
          type: "function",
        },
        {
          inputs: [
            {
              internalType: "string",
              name: "farmerName",
              type: "string",
            },
          ],
          name: "getBatchesByFarmer",
          outputs: [
            {
              internalType: "string[]",
              name: "",
              type: "string[]",
            },
          ],
          stateMutability: "view",
          type: "function",
        },
      ];
      async function connectWallet() {
        if (window.ethereum) {
          try {
            await window.ethereum.request({ method: "eth_requestAccounts" });
            web3 = new Web3(window.ethereum);
            contract = new web3.eth.Contract(abi, contractAddress);
            alert("Connected to MetaMask!");
          } catch (err) {
            alert("Connection failed: " + err.message);
          }
        } else {
          alert("MetaMask not found!");
        }
      }

      async function addBatch() {
        const accounts = await web3.eth.getAccounts();
        const productName = document.getElementById("productName").value;
        const originFarm = document.getElementById("originFarm").value;
        const farmerName = document.getElementById("farmerName").value;
        const harvestDateInput = document.getElementById("harvestDate").value;

        if (!productName || !originFarm || !farmerName || !harvestDateInput) {
          alert("Please fill in all fields.");
          return;
        }

        const harvestDate = Math.floor(
          new Date(harvestDateInput).getTime() / 1000
        );

        await contract.methods
          .addBatch(productName, originFarm, farmerName, harvestDate)
          .send({ from: accounts[0] });

        alert("Batch added successfully!");
      }

      async function updateTransportInfo() {
        const accounts = await web3.eth.getAccounts();
        const batchId = document.getElementById("batchIdTransport").value;
        const transporterName =
          document.getElementById("transporterName").value;
        const transportDetails =
          document.getElementById("transportDetails").value;
        const transportDateInput =
          document.getElementById("transportDate").value;

        if (
          !batchId ||
          !transporterName ||
          !transportDetails ||
          !transportDateInput
        ) {
          alert("Please fill in all fields.");
          return;
        }

        const transportDate = Math.floor(
          new Date(transportDateInput).getTime() / 1000
        );

        await contract.methods
          .updateTransportInfo(
            batchId,
            transporterName,
            transportDetails,
            transportDate
          )
          .send({ from: accounts[0] });

        alert("Transport updated!");
      }

      async function updateWarehouseInfo() {
        const accounts = await web3.eth.getAccounts();
        const batchId = document.getElementById("batchIdWarehouse").value;
        const warehouseName = document.getElementById("warehouseName").value;
        const warehouseDetails =
          document.getElementById("warehouseDetails").value;
        const warehouseDateInput =
          document.getElementById("warehouseDate").value;

        if (
          !batchId ||
          !warehouseName ||
          !warehouseDetails ||
          !warehouseDateInput
        ) {
          alert("Please fill in all fields.");
          return;
        }

        const warehouseDate = Math.floor(
          new Date(warehouseDateInput).getTime() / 1000
        );

        await contract.methods
          .updateWarehouseInfo(
            batchId,
            warehouseName,
            warehouseDetails,
            warehouseDate
          )
          .send({ from: accounts[0] });

        alert("Warehouse updated!");
      }

      async function updateRetailerInfo() {
        const accounts = await web3.eth.getAccounts();
        const batchId = document.getElementById("batchIdRetail").value;
        const retailerName = document.getElementById("retailerName").value;
        const retailStore = document.getElementById("retailStore").value;
        const retailDateInput = document.getElementById("retailDate").value;

        if (!batchId || !retailerName || !retailStore || !retailDateInput) {
          alert("Please fill in all fields.");
          return;
        }

        const retailDate = Math.floor(
          new Date(retailDateInput).getTime() / 1000
        );

        await contract.methods
          .updateRetailerInfo(batchId, retailerName, retailStore, retailDate)
          .send({ from: accounts[0] });

        alert("Retail info updated!");
      }

      async function getBatch() {
        const farmerName = document.getElementById("farmerNameInput").value;
        if (!farmerName) {
          alert("Enter a farmer name");
          return;
        }

        try {
          const batchIds = await contract.methods
            .getBatchesByFarmer(farmerName)
            .call();
          const batchDetails = [];

          for (const batchId of batchIds) {
            const batch = await contract.methods.batches(batchId).call();
            // console.log("Raw batch data:", batch);

            const formattedBatch = {
              batchId: batch.batchId?.toString(),
              productName: batch.farmer?.productName || "",
              originFarm: batch.farmer?.originFarm || "",
              farmerName: batch.farmer?.farmerName || "",
              harvestDate: batch.farmer?.harvestDate
                ? formatDateFromTimestamp(batch.farmer.harvestDate)
                : "",

              transporterName: batch.transport?.transporterName || "",
              transportDetails: batch.transport?.transportDetails || "",
              transportDate: batch.transport?.transportDate
                ? formatDateFromTimestamp(batch.transport.transportDate)
                : "",

              warehouseName: batch.warehouse?.warehouseName || "",
              warehouseDetails: batch.warehouse?.warehouseDetails || "",
              warehouseDate: batch.warehouse?.warehouseDate
                ? formatDateFromTimestamp(batch.warehouse.warehouseDate)
                : "",

              retailerName: batch.retailer?.retailerName || "",
              retailStore: batch.retailer?.retailStore || "",
              retailDate: batch.retailer?.retailDate
                ? formatDateFromTimestamp(batch.retailer.retailDate)
                : "",

              currentOwner: batch.currentOwner || "",
              status: batch.status || "",
            };

            batchDetails.push(formattedBatch);
          }

          document.getElementById("batchResult").textContent = JSON.stringify(
            batchDetails,
            null,
            2
          );
        } catch (err) {
          document.getElementById("batchResult").textContent =
            "Error fetching batch: " + err.message;
        }
      }

      function formatDateFromTimestamp(timestamp) {
        const ts =
          typeof timestamp === "bigint" ? Number(timestamp) : timestamp;
        const date = new Date(ts * 1000); // Convert to milliseconds
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }
    </script>
  </body>
</html>
