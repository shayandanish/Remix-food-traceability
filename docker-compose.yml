version: "3.8"

services:
  frontend:
    # Specify the frontend service
    build:
      context: ./frontend # Path to the frontend directory
    ports:
      - "80:80" # Expose frontend on port 80
    networks:
      - web3_network

  backend:
    # Specify the backend service (e.g., Hardhat for Solidity contracts)
    build:
      context: ./backend # Path to the backend directory
    ports:
      - "8545:8545" # Expose Hardhat Ethereum network on port 8545
    networks:
      - web3_network
    environment:
      - NETWORK=hardhat # Environment variable to specify the network

  db:
    # Database service (PostgreSQL in this case)
    image: postgres:13 # Use the official PostgreSQL image
    environment:
      POSTGRES_PASSWORD: shayan # Set the password for PostgreSQL
    ports:
      - "5432:5432" # Expose PostgreSQL on port 5432

networks:
  web3_network:
    driver: bridge # Use bridge network for communication between services
